<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Instrument Serif";
    src: url("../fonts/InstrumentSerif-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/InstrumentSans-Regular.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 264px;
    overflow: hidden;
    background: #12151c;
  }
  .field { position: absolute; inset: 0; }
  .lock {
    position: absolute;
    left: 40px;
    top: 18px;
  }
  .plate {
    width: 480px;
    height: 112px;
    background: #f4efe6;
    box-shadow: 8px 8px 0 #c4622d;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    padding: 0 22px 0 16px;
  }
  .mark { width: 76px; height: 76px; flex: 0 0 auto; }
  .copy { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
  h1 {
    font-family: "Instrument Serif", "Liberation Serif", serif;
    font-weight: 400;
    font-size: 46px;
    line-height: 0.88;
    letter-spacing: -0.03em;
    color: #12151c;
    white-space: nowrap;
  }
  .name {
    margin-top: 5px;
    font-family: "Instrument Serif", "Liberation Serif", serif;
    font-size: 20px;
    line-height: 1;
    color: #12151c;
    white-space: nowrap;
  }
  .role {
    margin-top: 6px;
    font-family: "Instrument Sans", "Liberation Sans", sans-serif;
    font-weight: 500;
    font-size: 13px;
    line-height: 1;
    letter-spacing: 0.12em;
    color: #c4622d;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <svg class="field" viewBox="0 0 1200 264" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>
    </defs>
    <rect width="1200" height="264" fill="#12151c"/>
    <rect width="1200" height="264" filter="url(#grain)" opacity="0.05"/>
    <g fill="none" stroke="#c4622d" stroke-width="1.25">
      <path d="M18 18 H48 M18 18 V48"/>
      <path d="M1182 18 H1152 M1182 18 V48"/>
    </g>
    <g fill="none" stroke="#c4622d" stroke-width="1" opacity="0.4">
      <circle cx="1010" cy="78" r="70"/>
      <circle cx="1010" cy="78" r="40"/>
      <path d="M900 78 H1120"/>
      <path d="M1010 8 V148"/>
    </g>
    <g fill="none" stroke="#f4efe6" stroke-width="1" opacity="0.16">
      <path d="M760 168 H1148"/>
      <path d="M820 186 H1100"/>
    </g>
  </svg>
  <div class="lock">
    <div class="plate">
      <svg class="mark" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2" y="2" width="92" height="92" fill="none" stroke="#c4622d" stroke-width="2"/>
        <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
          <path stroke="#c4622d" stroke-width="6.5" d="M22 26 V72 M22 26 H46 M46 26 V48 M22 48 H46 M37 48 L50 72"/>
          <path stroke="#12151c" stroke-width="6.5" d="M62 26 V72 M62 49 L78 26 M62 49 L78 72"/>
        </g>
      </svg>
      <div class="copy">
        <h1>Rosdeb OS</h1>
        <p class="name">Rosdeb Koch</p>
        <p class="role">Senior Mobile Engineer</p>
      </div>
    </div>
  </div>
</body>
</html>
